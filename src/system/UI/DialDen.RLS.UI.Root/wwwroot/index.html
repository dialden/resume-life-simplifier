<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="DialDen.RLS.UI.Root.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <img class="loading-logo" src="/branding/jardins-hsl-mark.svg" alt="Côté-Jardins inc." />
        <div class="loading-percentage"></div>
        <div class="loading-progress-text">Côté-Jardins inc.</div>
    </div>

    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.rlsSetDocumentLanguage = lang => document.documentElement.lang = lang;
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        Blazor.start({
            configureRuntime: runtime => runtime.withConfig({
                loadAllSatelliteResources: true
            })
        });
    </script>
</body>

</html>
