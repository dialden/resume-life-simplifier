server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /appsettings.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /_framework/ {
        try_files $uri =404;
    }

    location /_content/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
