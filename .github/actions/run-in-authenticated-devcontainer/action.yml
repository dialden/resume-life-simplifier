name: 'Run command in authenticated dev container'
description: 'Sets up auth and runs a specified command inside the dev container.'

inputs:
  run_command:
    description: 'The command to execute after authentication is complete.'
    required: true
  gh_token:
    description: 'Github token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Run command in dev container
      uses: devcontainers/ci@v0.3
      with:
        cacheFrom: ghcr.io/dialden/resume-life-simplifier/devcontainer
        runCmd: |
          set -euo pipefail

          # Login to github
          echo ${{ inputs.gh_token }} | gh auth login --with-token

          # Configure Docker auth non-interactively
          echo ${{ inputs.gh_token }} | docker login ghcr.io --username ${{ github.actor }} --password-stdin

          # Execute the unique command passed from the workflow
          ${{ inputs.run_command }}