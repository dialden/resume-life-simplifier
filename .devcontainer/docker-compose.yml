services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/workspaces/resume-life-simplifier
      # The chat catalog and conversation databases live in separate directories.
      - vscode-user-data:/home/vscode/.vscode-server/data/User
      - vscode-agent-session-data:/home/vscode/.vscode-server/data/agentSessionData
      # Keep the existing transcript volume; the parent also preserves the session index.
      - copilot-user-data:/home/vscode/.copilot
      - copilot-session-state:/home/vscode/.copilot/session-state
    command:
      - /bin/sh
      - -c
      - exec sleep infinity
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Required}
      PGHOST: ${PGHOST:?Required}
      PGPORT: ${PGPORT:?Required}
      FLYWAY_USER: ${POSTGRES_USER:?Required}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=rls_dev;Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      RLS_TEST_CONNECTION_STRING: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=rls_test;Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the databases on a fresh volume; postCreateCommand runs Flyway for their schemas.
      - ../ops/database/init/development:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vscode-user-data:
  vscode-agent-session-data:
  copilot-user-data:
  copilot-session-state:
  postgres-data: