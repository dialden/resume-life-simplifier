services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      wiremock-job-site:
        condition: service_healthy
      wiremock-ollama:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ../:/workspaces/resume-life-simplifier
      # The chat catalog and conversation databases live in separate directories.
      - vscode-user-data:/home/vscode/.vscode-server/data/User
      - vscode-agent-session-data:/home/vscode/.vscode-server/data/agentSessionData
      # Keep the existing transcript volume; the parent also preserves the session index.
      - copilot-user-data:/home/vscode/.copilot
      - copilot-session-state:/home/vscode/.copilot/session-state
      # CLI logins survive rebuilds; the GitHub workflow logs out when its command ends.
      - gh-config:/home/vscode/.config/gh
      - gcloud-config:/home/vscode/.config/gcloud
    command:
      - /bin/sh
      - -c
      - exec sleep infinity
    env_file:
      - path: .env.local
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Required}
      API_HTTP_URL: ${API_HTTP_URL:?Required}
      API_HTTPS_URL: ${API_HTTPS_URL:?Required}
      UI_HTTP_URL: ${UI_HTTP_URL:?Required}
      UI_HTTPS_URL: ${UI_HTTPS_URL:?Required}
      API_PROJECT_FILE: ${API_PROJECT_FILE:?Required}
      UI_PROJECT_FILE: ${UI_PROJECT_FILE:?Required}
      PGHOST: ${PGHOST:?Required}
      PGPORT: ${PGPORT:?Required}
      RLS_DEV_DATABASE: ${RLS_DEV_DATABASE:?Required}
      RLS_TEST_DATABASE: ${RLS_TEST_DATABASE:?Required}
      FLYWAY_USER: ${POSTGRES_USER:?Required}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      RLS_TEST_Hosting__Mode: ${TEST_HOSTING_MODE:-InProcess}
      RLS_TEST_Hosting__APIUrl: ${RLS_TEST_Hosting__APIUrl:-}
      RLS_TEST_Hosting__UIUrl: ${RLS_TEST_Hosting__UIUrl:-}
      RLS_API_Cors__AllowedOrigins__0: ${UI_HTTP_URL:?Required}
      RLS_API_Cors__AllowedOrigins__1: ${UI_HTTPS_URL:?Required}
      RLS_API_PublicWebsite__BaseUrl: ${UI_HTTP_URL:?Required}
      REAL_EXT_SYSTEMS_RLS_API_PublicWebsite__BaseUrl: ${UI_HTTP_URL:?Required}
      STUBBED_EXT_SYSTEMS_RLS_API_PublicWebsite__BaseUrl: ${UI_HTTP_URL:?Required}
      RLS_API_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_DEV_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      REAL_EXT_SYSTEMS_RLS_API_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_TEST_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      STUBBED_EXT_SYSTEMS_RLS_API_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_TEST_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      RLS_WORKER_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_DEV_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      REAL_EXT_SYSTEMS_RLS_WORKER_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_TEST_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      STUBBED_EXT_SYSTEMS_RLS_WORKER_ConnectionStrings__RLS: Host=${PGHOST:?Required};Port=${PGPORT:?Required};Database=${RLS_TEST_DATABASE:?Required};Username=${POSTGRES_USER:?Required};Password=${POSTGRES_PASSWORD:?Required}
      RLS_TEST_JobSites__WireMockUrl: http://wiremock-job-site/
      RLS_TEST_ResumeAnalysis__WireMockUrl: http://wiremock-ollama/
      RLS_WORKER_Ollama__Endpoint: http://ollama:11434/
      RLS_WORKER_Ollama__Model: qwen2.5vl:7b
      STUBBED_EXT_SYSTEMS_RLS_WORKER_Ollama__Endpoint: http://wiremock-ollama/
      RLS_WORKER_JobSites__Type: real
      RLS_WORKER_Jobillico__Endpoint: ${JOBILLICO_ENDPOINT:?Required}
      RLS_WORKER_Jobillico__UseProduction: "true"
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Type: stubbed
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__0__Id: stub-job-site
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__0__Name: Stub Job Site
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__0__Url: http://wiremock-job-site/
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__1__Id: another-stub-job-site
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__1__Name: Another Stub Job Site
      STUBBED_EXT_SYSTEMS_RLS_WORKER_JobSites__Sites__1__Url: http://wiremock-job-site/


  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      RLS_DEV_DATABASE: ${RLS_DEV_DATABASE:?Required}
      RLS_TEST_DATABASE: ${RLS_TEST_DATABASE:?Required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the databases on a fresh volume; postCreateCommand runs Flyway for their schemas.
      - ../ops/database/init/development:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

# ---------------------------------------------------------------------------
  # Ollama Initializer (Runs first, pulls the model into the volume, then exits)
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama serve & sleep 2 && ollama pull qwen2.5vl:7b"]

  # ---------------------------------------------------------------------------
  # Main Ollama Service (Boots up once the model is guaranteed to be cached)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s  # Only needs a brief window for the server process to bind to port 11434
      
# ---------------------------------------------------------------------------
  # Open WebUI (ChatGPT-style browser interface)
  # ---------------------------------------------------------------------------
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false  # Set to true if you want login authentication
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy



  wiremock-job-site:
    image: sheyenrath/wiremock.net
    ports:
      - "9095:80"
    command: --verbose
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET /__admin/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r response <&3 && [[ "$$response" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 5

  wiremock-ollama:
    image: sheyenrath/wiremock.net
    ports:
      - "9096:80"
    command: --verbose
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET /__admin/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r response <&3 && [[ "$$response" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vscode-user-data:
  vscode-agent-session-data:
  copilot-user-data:
  copilot-session-state:
  gh-config:
  gcloud-config:
  postgres-data:
  ollama_data:
  open_webui_data: