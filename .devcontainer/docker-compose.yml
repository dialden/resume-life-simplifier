services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/workspaces/resume-life-simplifier
      # The chat catalog and conversation databases live in separate directories.
      - vscode-user-data:/home/vscode/.vscode-server/data/User
      - vscode-agent-session-data:/home/vscode/.vscode-server/data/agentSessionData
      # Keep the existing transcript volume; the parent also preserves the session index.
      - copilot-user-data:/home/vscode/.copilot
      - copilot-session-state:/home/vscode/.copilot/session-state
    command: sleep infinity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PGHOST: postgres
      PGPORT: "5432"
      FLYWAY_USER: ${POSTGRES_USER:-rls}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-rls_dev}
      ConnectionStrings__RLS: Host=postgres;Port=5432;Database=rls_dev;Username=${POSTGRES_USER:-rls};Password=${POSTGRES_PASSWORD:-rls_dev}
      RLS_TEST_CONNECTION_STRING: Host=postgres;Port=5432;Database=rls_test;Username=${POSTGRES_USER:-rls};Password=${POSTGRES_PASSWORD:-rls_dev}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rls_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the databases on a fresh volume; postCreateCommand runs Flyway for their schemas.
      - ../ops/database/init/development:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vscode-user-data:
  vscode-agent-session-data:
  copilot-user-data:
  copilot-session-state:
  postgres-data: